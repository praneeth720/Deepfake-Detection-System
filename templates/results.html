<!DOCTYPE html>
<html>
<head>
    <title>Detection Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dashboard-bg">

<div class="dashboard-container">

    <div class="top-bar">
        <h2>Deepfake Detection Result</h2>
        <a href="{{ url_for('dashboard') }}" class="logout-btn">⬅ Back</a>
    </div>

    <div class="glass-card result-card">
        <div class="result-media">
            {% if result.type == "Image" %}
                <img src="{{ result.file_path }}">
            {% elif result.type == "Video" %}
                <video controls>
                    <source src="{{ result.file_path }}" type="video/mp4">
                </video>
            {% elif result.type == "Audio" %}
                <audio controls>
                    <source src="{{ result.file_path }}">
                </audio>
            {% endif %}
        </div>

        <div class="result-title">
            File Type: {{ result.type }}
        </div>

        <div class="verdict {% if 'Real' in result.verdict %}real{% else %}fake{% endif %}">
            {{ result.verdict }}
        </div>
    </div>

</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">Processing...</div>
</div>

<script>
const overlay = document.getElementById('loadingOverlay');
const form = document.querySelector('form');
if(form){
    form.addEventListener('submit', () => overlay.classList.add('active'));
}
</script>

</body>
</html>
